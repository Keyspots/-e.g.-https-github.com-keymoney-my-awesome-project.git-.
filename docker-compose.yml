version: '3.9'

services:
  api:
    build: .
    ports:
      - '5000:5000'
    env_file: backend/.env
    environment:
      OLLAMA_BASE_URL: http://host.docker.internal:11434
    restart: unless-stopped

  crm:
    build:
      context: ./agara-crm
      dockerfile: Dockerfile
    ports:
      - '3000:3000'
    env_file:
      - agara-crm/.env.local
    environment:
      NEXT_PUBLIC_APP_URL: http://localhost:3000
    depends_on:
      - api
    restart: unless-stopped
